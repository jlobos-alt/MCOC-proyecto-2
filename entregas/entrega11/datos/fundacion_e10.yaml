# Caso E10: fundacion del IFC con ambiente real, suelo anual y moldaje por vertida.
#
# Geometria, secuencia, temperatura de colocacion, moldaje y aislacion salen del
# IFC (geometry/foundation.ifc) con mcplan.extraer_solidos y plan_desde_solidos.
# Aqui se declara lo que el IFC no contiene: catalogos de moldaje/aislacion,
# hidratacion, criterios y el suelo como medio semi-infinito.
#
# Diferencias con E09:
#   - el moldaje ya no es una capa global de 0 a 72 h: cada vertida trae su
#     propio Moldaje/Aislacion y su RetiroMoldaje_h desde el IFC;
#   - el suelo tiene onda anual amortiguada (no una temperatura constante);
#   - el clima del demo se inyecta desde datos/forecast/ (Open-Meteo).

caso: fundacion_e10
descripcion: >
  Fundacion octagonal con pedestal, 5 vertidas leidas del IFC. El ambiente se
  arma con un forecast de Open-Meteo y climatologia de reanalysis; el moldaje y
  la aislacion son capas en serie por vertida. Parametros de hidratacion aun
  provisorios: el objetivo de E10 es la cadena ambiente -> frontera.

materiales:
  M1:          # hormigon de Ju & Lei (2019)
    k: 2.22
    cp: 970.0
    rho: 2400.0

# Catalogos de capas. R = espesor / k  [m2 K/W]
moldajes:
  Ninguno:
    espesor_m: 0.0
    k: 1.0
  Madera:               # terciado 19 mm, k tipico 0.12 W/(m K)
    espesor_m: 0.019
    k: 0.12
  Metalico:             # plancha 4 mm, acero
    espesor_m: 0.004
    k: 45.0

aislaciones:
  Ninguna:
    espesor_m: 0.0
    k: 1.0
  EPS_50mm:             # poliestireno expandido
    espesor_m: 0.05
    k: 0.035
  Lana_mineral_50mm:
    espesor_m: 0.05
    k: 0.040

hidratacion:
  elevacion_adibatica_C: 45.0
  tau_h: 30.0
  madurez: true
  energia_activacion_K: 4000.0   # Ea/R, equivale a Ea ~ 33 kJ/mol

# Clima de respaldo para el caso base (sin datos): 15 +- 5 C diario.
ambiente:
  media_C: 15.0
  amplitud_C: 5.0
  periodo_h: 24.0

# Suelo: onda anual a 1 m de profundidad.
# d = sqrt(alpha P / pi); con estos valores d ~ 2.7 m, amortiguacion ~0.69
# y atraso de fase ~21 dias. maximo en superficie a mediados de febrero.
suelo:
  k: 1.389
  rho: 1600.0
  cp: 1200.0
  media_C: 14.5
  amplitud_C: 4.5
  periodo_h: 8760.0
  fase_h: 1920.0        # ~80 dias despues del 27-nov: maximo de verano
  profundidad_m: 1.0

fronteras:
  - name: perimetro
    direccion: perimetro
    tipo: convectiva
    h: 12.0             # respaldo; el demo lo reemplaza por h(viento)+h(radiacion)
  - name: superficie
    direccion: superficie
    tipo: convectiva
    h: 12.0
  - name: base
    direccion: base
    tipo: convectiva
    h: .inf             # sin pelicula: el far field esta a 1 m dentro del suelo
    capas:
      - tipo: conductiva
        nombre: contacto_suelo
        espesor_m: 1.0
        k: 1.389        # R_suelo = 1.0 / 1.389 = 0.72 m2 K/W
        desde_h: 0.0
        hasta_h: .inf

criterios:
  T_max_C: 70.0
  delta_T_max_C: 20.0
  core_erosion: 2
  incluir_base_en_superficie: false

simulacion:
  duracion_h: 336.0        # 14 dias desde la primera vertida
  intervalo_salida_h: 1.0
  factor_estabilidad: 0.8
