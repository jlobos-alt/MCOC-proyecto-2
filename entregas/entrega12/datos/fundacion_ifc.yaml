# Plantilla del caso con la fundacion real (E07).
#
# Geometria, secuencia y temperatura de colocacion NO se declaran aqui: salen de
# geometry/foundation.ifc con mcplan.extraer_solidos y mcplan.plan_desde_solidos.
# Aqui solo va lo que el IFC no contiene.
#
# PROVISORIO hasta E09-E12: hidratacion sin calibrar, clima sinusoidal generico
# (no es el de Chanco) y moldaje comun a todas las caras laterales entre 0 y 72 h
# (no se retira vertida por vertida).

caso: fundacion_ifc
descripcion: >
  Fundacion octagonal con pedestal, 5 vertidas leidas del IFC. Parametros termicos
  provisorios: sirve para probar la cadena IFC -> grilla -> solver, no para concluir.

materiales:
  M1:          # hormigon de Ju & Lei (2019)
    k: 2.22
    cp: 970.0
    rho: 2400.0

hidratacion:
  elevacion_adibatica_C: 45.0
  tau_h: 30.0
  madurez: true
  energia_activacion_K: 4000.0   # Ea/R, equivale a Ea ~ 33 kJ/mol

ambiente:
  media_C: 15.0
  amplitud_C: 5.0
  periodo_h: 24.0

suelo:
  media_C: 12.0

fronteras:
  - name: perimetro
    direccion: perimetro
    tipo: convectiva
    h: 12.0
    capas:
      - tipo: conductiva
        nombre: encofrado
        espesor_m: 0.02
        k: 0.5
        desde_h: 0.0
        hasta_h: 72.0
  - name: superficie
    direccion: superficie
    tipo: convectiva
    h: 12.0
  - name: base
    direccion: base
    tipo: convectiva
    h: 6.0
    capas:
      - tipo: conductiva
        nombre: contacto_suelo
        espesor_m: 1.0
        k: 1.389
        desde_h: 0.0
        hasta_h: .inf

criterios:
  T_max_C: 70.0
  delta_T_max_C: 20.0
  core_erosion: 2
  incluir_base_en_superficie: false

simulacion:
  duracion_h: 336.0        # 14 dias desde la primera vertida
  intervalo_salida_h: 1.0
  factor_estabilidad: 0.8
