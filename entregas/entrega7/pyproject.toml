[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcplan"
version = "0.1.0"
description = "Planificador térmico de hormigón masivo: BIM/IFC -> solver -> confiabilidad"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7"]
bim = ["ifcopenshell>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
